name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Show the environment
        run: |
          uv run --locked python -c "
          import sys
          from importlib.metadata import version
          print('python', sys.version.split()[0], *(f'{p} {version(p)}' for p in ('jax', 'jaxlib', 'numpy', 'scipy')))
          "
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format check
        run: uv run --locked ruff format --check .
      - name: Tests
        run: uv run --locked pytest
