[project]
name = "predictability-horizon"
version = "0.1.0"
description = "Measuring learned world models in units of Lyapunov time, and separating chaos-limited from model-limited error."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.2",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mpmath>=1.3.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.8.22"

[tool.uv.build-backend]
module-name = "horizon"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "D", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
# Per-test time limit (D-036): a hung test fails instead of blocking the run. SIGALRM stops
# Python-level hangs; it cannot stop a non-terminating XLA loop, for which the faulthandler
# dump below names the line. A test that needs longer carries @pytest.mark.timeout(N),
# declared when the test is written and logged first (D-025). Never change these to fit
# the code under test.
timeout = 60
timeout_method = "signal"
timeout_func_only = false  # fixture setup, including the lazy oracle build, counts too
faulthandler_timeout = 120  # diagnostic stack dump only, not a pass/fail threshold
markers = [
    "slow: long-running validation tests (CI still runs them)",
]
filterwarnings = [
    # JAX emits this when a float64 request is silently truncated to float32.
    "error:Explicitly requested dtype:UserWarning",
]
