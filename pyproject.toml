[project]
name = "predictability-horizon"
version = "0.1.0"
description = "Measuring learned world models in units of Lyapunov time, and separating chaos-limited from model-limited error."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.2",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.8.22"

[tool.uv.build-backend]
module-name = "horizon"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "D", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
